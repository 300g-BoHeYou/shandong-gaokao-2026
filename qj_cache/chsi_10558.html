<!DOCTYPE html>
<html>

<head>
    
    <meta content="text/html" charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1">
    
    <title>中山大学强基计划报名平台</title>
    <link rel="icon" href="//t1.chei.com.cn/chsi/favicon.ico" type="image/x-icon"/>
    
    <link rel="stylesheet" href="https://t2.chei.com.cn/bm/jcxkzs/stu/assets/css/stu-block-1-1.0.1.min.css">
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-100524-24"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'UA-100524-24');
</script>
</head>

<body>
<div class="layout" v-cloak id="app">
    <div class="qjjh-header-other">
        <div class="qjjh-header-width qjjh-header-flex">
            <div class="header-left">
                <div class="header-left-img">
                    <img :src="'https://t3.chei.com.cn/common/xh/' + yxdm + '.jpg'" class="qjjh-logo-img"/>
                </div>
                <div>
                    
                    <h1 class="qjjh-logo-text">中山大学强基计划报名平台</h1>
                    <div class="qjjh-logo-time">报名时间：{{time}}</div>
                </div>
            </div>
            <div class="header-right">
                
                <template>
                    <a :href="'/jcxkzs/stu/index?orgId='+orgid">登录</a>
                    <span class="divider"></span>
                    <a href="https://account.chsi.com.cn/account/preregister.action?from=gaokao-zzbm">注册</a>
                </template>
            </div>
        </div>
    </div>
    <Layout class="qjjh-layout-width login">
        <Card class="qjjh-card-other">
            <div class="qjjh-tabs">
                <a :class="menuActive" :href="'/jcxkzs/sch/'+yxdm">招生简章</a>
                <a :class="menuActive1" :href="'/jcxkzs/sch/ggtzs/'+yxdm">公告通知</a>
            </div>
            <Layout>
    <Content :style="{minHeight: '600px', background: '#fff'}">
        <template v-if="jzbt">
            <h3 style="font-size: 20px;text-align: center;margin: 24px 0 16px;">{{jzbt}}</h3>
            <div v-html="content" class="margin-bottom-20 qjjh-news-content"></div>
            <div>
                <tag style="margin-bottom: 10px;" type="dot" color="primary" v-for="item,index in existFjvo">
                    <a style="color: #2d8cf0;" target="_blank" :href="'/jcxkzs/sch/download/yxdm/'+yxdm+'/fjId/'+item.fileid"
                       :download="item.filename">{{item.filename}}</a>
                </tag>
            </div>
        </template>
        <template v-else>
            <div class="qjjh-empty-box" style="padding-top: 190px;">
                <img src="https://t2.chei.com.cn/bm/jcxkzs/stu/assets/images/empty.svg">
                暂未发布
            </div>
        </template>
    </Content>
</Layout>
        </Card>
    </Layout>
    <div style="text-align: center;padding: 20px;">Copyright © 2003-<span>2026</span> 学信网 All Rights Reserved&ensp;&ensp;&ensp;&ensp;客服电话：010-67410388&ensp;&ensp;&ensp;&ensp;客服邮箱：kefu@chsi.com.cn</div>
</div>
<script src="https://t4.chei.com.cn/common/js/api-1.0.4.js"></script>
<script>
    api.pollingOptions = {
        resPage: false, //返回结果是否页面
        resType: 'json', // 默认：json, 表示轮询结果格式为json，当可选项：txt、html时，表示返回String，不进行json解析
        taskUrl: '/jcxkzs/ajaxRs',
        pollingUrl: '/jcxkzs/asynProgress',
        pollingLimit: 10, // 请求的最大次数，默认：10次
        pollingCount: 0, // 当前正常轮询的总次数，初始值：0
        pollingDelay: 1000, // 正常轮询时，请求延迟毫秒数，默认：1000毫秒
        delayGaps: 300, // 轮询请求间隔递增毫秒数，默认：0毫秒（建议不要超过1000）
        retryCount: 0, // 发生错误时，当前已重试的次数，初始值：0
        retryLimit: 1, // 当发生错误时请求的最大次数，默认：1次
        retryAfter: 1000, //第一次发送请求毫秒数，默认：1000毫秒
        retryGaps: 300, // 发送请求的递增毫秒数,默认：300毫秒
    };
    // api 统一配置
    api.axiosConfig = {
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded;charset=utf-8'
        }, // 其他为axios的配置-设置headers
        timeout: 60000 // 其他为axios的配置-请求超时时间
    };
    api.errorCallback = function (code, msg) {
        // 当其他错误发生时，弹出提示层
        setTimeout(function () {
            iview.Modal.error({
                title: '提示',
                content: msg
            });
        }, 500);
    };
</script>
<script src="//t1.chei.com.cn/common/js/vue/2.6.10/vue.min.js"></script>
<script src="//t1.chei.com.cn/common//vue-plugins/iview4.0/js/iview.min.js"></script>
<script src="//t3.chei.com.cn/common/js/vue-plugins/moment.min.js"></script>
<script src="https://t1.chei.com.cn/bm/jcxkzs/stu/assets/js/app-1.0.3.js"></script>
<script src="https://t1.chei.com.cn/common/ch/browser/not-ie.min.js"></script>
<script type="text/javascript">
    var mixin = {
        data: function () {
            return {
                jzbt: "\u4E2D\u5C71\u5927\u5B662026\u5E74\u5F3A\u57FA\u8BA1\u5212\u62DB\u751F\u7B80\u7AE0",
                time:"2026-04-10 09:07 \u81F3 2026-04-30 23:59",
                content: "<p><a href=\"https:\/\/admission.sysu.edu.cn\/f\/newsCenter\/article\/396d66629667441bbcb590354adca785\" target=\"_self\" title=\"\">\u300A<span style=\"text-indent: 28px; text-wrap-mode: wrap;\">\u4E2D\u5C71\u5927\u5B662026\u5E74\u5F3A\u57FA\u8BA1\u5212\u62DB\u751F\u7B80\u7AE0<\/span>\u300B<\/a>\uFF08\u8BF7\u70B9\u51FB\uFF09<\/p>",
                existFjvo: []
            }
        },
        mounted: function () {
            this.menuActive = 'active';
        }
    };
</script>
<script>
    new Vue({
        el: '#app',
        mixins: typeof mixin != 'undefined' ? [mixin] : {},
        data: function () {
            return {
                menuActive: '',
                menuActive1: '',
                yxdm: 10558,
                orgid: '476744838'
            }
        }
    });
</script>
</body>

</html>
