0;text-indent:43px;text-autospace:ideograph-numeric;text-align:justify;text-justify:inter-ideograph;line-height:37px;background:rgb(255,255,255)\"><strong><span style=\"font-family: \u6977\u4F53_GB2312;font-size: 21px\">2.\u914D\u5907\u4E00\u6D41\u5E08\u8D44\uFF0C\u7EC4\u5EFA\u9AD8\u6C34\u5E73\u6559\u5E08\u548C\u5BFC\u5E08\u56E2\u961F\u3002<\/span><\/strong><span style=\"font-family: \u4EFF\u5B8B_GB2312;font-size: 21px\"><span style=\"font-family:\u4EFF\u5B8B_GB2312\">\u575A\u6301\u6821\u5185\u4E0E\u6821\u5916\u5E76\u4E3E\u3001\u6C34\u5E73\u4E0E\u8D23\u4EFB\u5E76\u91CD\u7684\u539F\u5219\uFF0C\u5EFA\u8BBE\u4E00\u652F\u7531\u672C\u6821\u6559\u5E08\u53CA\u56FD\u5185\u5916\u4E13\u5BB6\u5B66\u8005\u7EC4\u6210\u7684\u5B66\u672F\u6C34\u5E73\u9AD8\u3001\u8D23\u4EFB\u5FC3\u5F3A\u3001\u6709\u70ED\u60C5\u3001\u80AF\u6295\u5165\u7684\u4E00\u6D41\u5E08\u8D44\u961F\u4F0D\u3002\u8BBE\u7ACB<\/span><span style=\"font-family:\u4EFF\u5B8B_GB2312\">\u201C\u9996\u5E2D\u5BFC\u5E08\u3001\u65B0\u751F\u5BFC\u5E08\u3001\u5B66\u4E1A\u5BFC\u5E08\u548C\u4EBA\u6587\u5BFC\u5E08\u201D\u56DB\u4F4D\u4E00\u4F53\u7684\u5BFC\u5E08\u56E2\u961F\uFF0C\u5728\u4EBA\u751F\u5F15\u5BFC\u3001\u5FD7\u8DA3\u6FC0\u53D1\u3001\u5B66\u4E1A\u6307\u5BFC\u3001\u7D20\u517B\u63D0\u5347\u3001\u79D1\u5B66\u7814\u7A76\u7B49\u65B9\u9762\u5BF9\u5B66\u751F\u7ED9\u4E88\u5168\u65B9\u4F4D\u6307\u5BFC\u3002 <\/span><\/span><\/p><p style=\"margin-left:0;text-indent:43px;text-autospace:ideograph-numeric;text-align:justify;text-justify:inter-ideograph;line-height:37px;background:rgb(255,255,255)\"><strong><span style=\"font-family: \u6977\u4F53_GB2312;font-size: 21px\">3.\u6539\u9769\u6559\u5B66\u65B9\u6CD5\uFF0C\u5B8C\u5584\u8003\u6838\u8BC4\u4EF7\u65B9\u5F0F\u3002<\/span><\/strong><span style=\"font-family: \u4EFF\u5B8B_GB2312;font-size: 21px\"><span style=\"font-family:\u4EFF\u5B8B_GB2312\">\u5EFA\u8BBE\u5C0F\u73ED\u7814\u8BA8\u8BFE\uFF0C\u4EE5\u9AD8\u8D28\u91CF\u7684\u4EA4\u6D41\u4E92\u52A8\uFF0C\u5145\u5206\u6FC0\u53D1\u5B66\u751F\u7684\u521B\u65B0\u601D\u7EF4\u3002\u63A8\u8FDB\u63A2\u7A76\u5F0F\u6559\u5B66\u548C\u81EA\u4E3B\u6027\u5B66\u4E60\uFF0C\u4EE5\u542F\u53D1\u5F0F\u3001\u8BA8\u8BBA\u5F0F\u7B49\u6559\u5B66\u65B9\u6CD5\u5F15\u5BFC\u5B66\u751F\u4E3B\u52A8\u53C2\u4E0E\u6559\u5B66\u3001\u81EA\u4E3B\u6DF1\u5EA6\u5B66\u4E60\u3001\u81EA\u4E3B\u6784\u5EFA\u77E5\u8BC6\u4F53\u7CFB\uFF0C\u6FC0\u53D1\u5B66\u751F\u5B66\u4E60\u7684\u4E3B\u4F53\u6027\u7CBE\u795E\u3002\u4E30\u5BCC\u63A2\u7A76\u5F0F\u3001\u8BBA\u6587\u5F0F\u3001\u62A5\u544A\u7B54\u8FA9\u5F0F\u7B49\u4F5C\u4E1A\u8BC4\u4EF7\u65B9\u5F0F\uFF0C\u63D0\u5347\u8BFE\u7A0B\u5B66\u4E60\u7684\u6DF1\u5EA6\u3002\u52A0\u5F3A\u5BF9\u5B66\u751F\u8BFE\u5802\u5185\u5916\u3001\u7EBF\u4E0A\u7EBF\u4E0B\u5B66\u4E60\u7684\u8BC4\u4EF7\uFF0C\u5F3A\u5316\u9605\u8BFB\u91CF\u548C\u9605\u8BFB\u80FD\u529B\u8003\u67E5\uFF0C\u63D0\u5347\u8BFE\u7A0B\u5B66\u4E60\u7684\u5E7F\u5EA6\u3002<\/span> <\/span><\/p><p style=\"margin-left:0;text-indent:43px;text-autospace:ideograph-numeric;text-align:justify;text-justify:inter-ideograph;line-height:37px;background:rgb(255,255,255)\"><strong><span style=\"font-family: \u6977\u4F53_GB2312;font-size: 21px\">4.\u672C\u7855\u535A\u76F8\u8854\u63A5\uFF0C\u5B66\u672F\u578B\u9AD8\u7AEF\u4EBA\u624D\u57F9\u517B\u9636\u6BB5\u524D\u79FB\u3002<\/span><\/strong><span style=\"font-family: \u4EFF\u5B8B_GB2312;font-size: 21px\"><span style=\"font-family:\u4EFF\u5B8B_GB2312\">\u5EFA\u7ACB\u8854\u63A5\u672C\u79D1\u6559\u80B2\u9636\u6BB5\uFF0C\u878D\u8D2F\u7855\u58EB\u548C\u535A\u58EB\u57F9\u517B\u9636\u6BB5\u7684\u5B66\u672F\u578B\u4EBA\u624D\u57F9\u517B\u673A\u5236\u3002\u5F3A\u57FA\u751F\u5B8C\u6210\u89C4\u5B9A\u7684\u672C\u79D1\u9636\u6BB5\u6709\u5173\u8BFE\u7A0B\uFF0C\u8FBE\u5230\u8F6C\u6BB5\u8981\u6C42\u540E\uFF0C\u6309\u7167\u6709\u5173\u89C4\u5B9A\u76F4\u63A5\u8F6C\u6BB5\u8FDB\u5165\u7814\u7A76\u751F\u57F9\u517B\u9636\u6BB5\uFF0C\u76F8\u5173\u5DE5\u4F5C\u53C2\u7167\u63A8\u8350\u514D\u8BD5\u5DE5\u4F5C\u7EDF\u4E00\u5728<\/span><span style=\"font-family:\u4EFF\u5B8B_GB2312\">\u201C\u5168\u56FD\u63A8\u8350\u514D\u8BD5\u4FE1\u606F\u516C\u5F00\u66A8\u7BA1\u7406\u670D\u52A1\u7CFB\u7EDF\u201D\u8FDB\u884C\u3002\u8F6C\u6BB5\u9AD8\u6821\u4E3A\u672C\u6821\uFF0C\u8F6C\u6BB5\u4E13\u4E1A\u7531\u5B66\u6821\u4F9D\u636E\u5F3A\u57FA\u8BA1\u5212\u57F9\u517B\u65B9\u6848\u548C\u62DB\u751F\u4E13\u4E1A\u8303\u56F4\u786E\u5B9A\uFF0C\u8FDB\u5165\u7814\u7A76\u751F\u9636\u6BB5\u540E\uFF0C\u5B66\u751F\u4E3B\u8981\u5728\u5F3A\u57FA\u8BA1\u5212\u6240\u5728\u57FA\u7840\u5B66\u79D1\u4E13\u4E1A\u8FDB\u884C\u57F9\u517B\uFF0C\u90E8\u5206\u5B66\u751F\u4E5F\u53EF\u6839\u636E\u57F9\u517B\u65B9\u6848\u5728\u9AD8\u7AEF\u82AF\u7247\u4E0E\u8F6F\u4EF6\u3001\u667A\u80FD\u79D1\u6280\u3001\u65B0\u6750\u6599\u3001\u5148\u8FDB\u5236\u9020\u548C\u56FD\u5BB6\u5B89\u5168\u7B49\u5173\u952E\u9886\u57DF\u4EE5\u53CA\u56FD\u5BB6\u4EBA\u624D\u7D27\u7F3A\u7684\u4EBA\u6587\u793E\u4F1A\u79D1\u5B66\u9886\u57DF\u8FDB\u884C\u5B66\u79D1\u4EA4\u53C9\u57F9\u517B\u3002\u672C\u7814\u8854\u63A5<\/span><\/span><span style=\"font-family: \u4EFF\u5B8B_GB2312;font-size: 21px\"><span style=\"font-family:\u4EFF\u5B8B_GB2312\">\u4E13\u4E1A\u8303\u56F4\u89C1\u5404\u5F3A\u57FA\u8BA1\u5212\u62DB\u751F\u4E13\u4E1A\u57F9\u517B\u65B9\u6848\uFF0C\u5177\u4F53\u4E13\u4E1A\u62DB\u751F\u540D\u989D\u4EE5\u5F53\u5E74\u5EA6\u5B66\u6821\u516C\u5E03\u7684\u5DE5\u4F5C\u65B9\u6848\u4E3A\u51C6\u3002<\/span> <\/span><\/p><p style=\"margin-left:0;text-indent:43px;text-autospace:ideograph-numeric;text-align:justify;text-justify:inter-ideograph;line-height:37px;background:rgb(255,255,255)\"><strong><span style=\"font-family: \u6977\u4F53_GB2312;font-size: 21px\">5.\u4FC3\u8FDB\u5B66\u79D1\u4EA4\u53C9\uFF0C\u9F13\u52B1\u5B66\u751F\u81EA\u7531\u63A2\u7D22\u3002<\/span><\/strong><span style=\"font-family: \u4EFF\u5B8B_GB2312;font-size: 21px\"><span style=\"font-family:\u4EFF\u5B8B_GB2312\">\u591A\u5B66\u79D1\u77E5\u8BC6\u7ED3\u6784\u662F\u521B\u65B0\u4EBA\u624D\u7684\u6838\u5FC3\u7D20\u517B\uFF0C\u9F13\u52B1\u548C\u652F\u6301\u5B66\u751F\u8DE8\u9886\u57DF\u3001\u8DE8\u5B66\u79D1\u3001\u8DE8\u4E13\u4E1A\u4FEE\u8BFB\u8F85\u4FEE\u4E13\u4E1A\u548C\u8F85\u4FEE\u5B66\u58EB\u5B66\u4F4D\u9879\u76EE\u3002\u521B\u9020\u8DE8\u5B66\u79D1\u7814\u7A76\u6761\u4EF6\uFF0C\u4F9D\u6258\u79D1\u7814\u548C\u6559\u5B66\u5B9E\u9A8C\u5BA4\uFF0C\u7EC4\u5EFA\u9AD8\u6C34\u5E73\u8DE8\u5B66\u79D1\u6559\u5B66\u56E2\u961F\uFF0C\u8BBE\u7ACB\u4EA4\u53C9\u5B66\u79D1\u7814\u7A76\u8BFE\u9898\uFF0C\u652F\u6301\u5B66\u751F\u53C2\u4E0E\u8BFE\u9898\u7814\u7A76\u3002\u5EFA\u7ACB\u6559\u5B66\u79D1\u7814\u5B9E\u8DF5\u591A\u5C42\u6B21\u878D\u5408\u3001\u8DE8\u5B66\u79D1\u591A\u4EA4\u53C9\u878D\u5408\u3001\u5168\u7403\u5316\u591A\u65B9\u4F4D\u878D\u5408\u7684\u4E09\u5927\u878D\u5408\u673A\u5236\uFF0C\u4E3A\u5B66\u751F\u8DE8\u5B66\u79D1\u5B66\u4E60\u3001\u7814\u7A76\u548C\u6DF1\u9020\u521B\u9020\u6761\u4EF6\u3002<\/span> <\/span><\/p><p style=\"margin-left:0;text-indent:43px;text-autospace:ideograph-numeric;text-align:justify;text-justify:inter-ideograph;line-height:37px;background:rgb(255,255,255)\"><strong><span style=\"font-family: \u6977\u4F53_GB2312;font-size: 21px\">6.\u642D\u5EFA\u5408\u4F5C\u5E73\u53F0\uFF0C\u63A8\u8FDB\u79D1\u6559\u534F\u540C\u80B2\u4EBA\u3002<\/span><\/strong><span style=\"font-family: \u4EFF\u5B8B_GB2312;font-size: 21px\"><span style=\"font-family:\u4EFF\u5B8B_GB2312\">\u642D\u5EFA\u5B66\u6821\u4E0E\u79D1\u7814\u9662\u6240\u6DF1\u5EA6\u5408\u4F5C\u7684\u6218\u7565\u5E73\u53F0\uFF0C\u805A\u7126\u56FD\u5BB6\u91CD\u5927\u6218\u7565\u9886\u57DF\u548C\u5173\u952E\u6838\u5FC3\u6280\u672F\u9886\u57DF\uFF0C\u4F18\u52BF\u4E92\u8865\uFF0C\u534F\u540C\u5408\u4F5C\uFF0C\u5171\u540C\u5F00\u5C55\u4EBA\u624D\u57F9\u517B\uFF0C\u4E3A\u56FD\u5BB6\u91CD\u5927\u6218\u7565\u9886\u57DF\u548C\u7D27\u7F3A\u9886\u57DF\u8F93\u9001\u540E\u5907\u4EBA\u624D\u3002\u5B9E\u65BD\u5F3A\u57FA\u8BA1\u5212\u5404\u4E13\u4E1A\u90FD\u5C06\u6839\u636E\u81EA\u8EAB\u7279\u70B9\u548C\u7279\u8272\uFF0C\u5229\u7528\u597D\u56FD
